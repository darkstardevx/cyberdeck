<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CYBERDECK Core</title>
    <style>
        :root {
            --bg-main: #000000;
            --bg-card: #050507;
            --border-color: #16181f;
            --text-primary: #f1f5f9;
            --text-muted: #525865;
            --accent-cyan: #06b6d4;
            --accent-purple: #7c3aed;
            --accent-amber: #f59e0b;
        }
        body { font-family: 'Courier New', monospace; background: var(--bg-main); color: var(--text-primary); padding: 20px; min-height: 100vh; }
        h2 { color: var(--accent-cyan); text-shadow: 0 0 10px rgba(6, 182, 212, 0.35), 0 0 20px rgba(124, 58, 237, 0.2); border-bottom: 2px solid var(--accent-purple); padding-bottom: 10px; letter-spacing: 2px; }
        h3 { color: var(--accent-purple); text-shadow: 0 0 5px rgba(124, 58, 237, 0.25); margin-top: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; margin-top: 20px; }
        button { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); padding: 14px; cursor: pointer; font-weight: bold; font-family: monospace; text-transform: uppercase; transition: all 0.2s ease-in-out; }
        button:hover { background: var(--accent-cyan); color: var(--bg-main); border-color: var(--accent-cyan); transform: translateY(-2px); }
        .panel { border: 1px solid var(--border-color); padding: 15px; background: var(--bg-card); margin-top: 20px; }
        ul { list-style-type: none; padding: 0; max-height: 300px; overflow-y: auto; background: #030305; border: 1px solid var(--border-color); padding: 10px; }
        li { padding: 6px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; color: var(--text-primary); }
        .status-val { color: var(--accent-amber); font-weight: bold; }
    </style>
    <script>
        /**
         * Dispatches a command to the backend.
         * @param {Object} command - The serialized enum variant (e.g., { "RunBatteryModule": "./diagnostics" })
         * @param {HTMLElement} btn - The button element trigger
         */
        async function sendCommand(command, btn) {
            const originalText = btn.innerText;
            btn.innerText = "⚡ EXECUTING...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/cyberdeck/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(command)
                });

                if (res.ok) {
                    btn.style.background = "var(--accent-cyan)";
                    btn.innerText = "✅ COMPLETE";
                    setTimeout(() => window.location.reload(), 800);
                } else {
                    throw new Error(await res.text());
                }
            } catch (err) {
                alert('System Error: ' + err.message);
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>
</head>
<body>
    <h2>⚡ CYBERDECK ⚡</h2>

    <div class="panel">
        <strong>DISPLAY STATUS:</strong> <span class="status-val">{{DISPLAY_STATUS}}</span> |
        <strong>STEALTH MODE:</strong> <span class="status-val">{{STEALTH_MODE}}</span> |
        <strong>REPORTS DETECTED:</strong> <span class="status-val">{{REPORTS_COUNT}}</span>
    </div>

    <h3>🔮 DISPATCH INFRASTRUCTURE SCANS</h3>
    <div class="grid">
        <button onclick="sendCommand({ 'RunHardwareModule': './diagnostics' }, this)">🖥️ Scan Hardware Core</button>
        <button onclick="sendCommand({ 'RunPowerModule': './diagnostics' }, this)">🔋 Scan Power Systems</button>
        <button onclick="sendCommand({ 'RunMemoryModule': './diagnostics' }, this)">🧠 Scan Memory Subsystem</button>
        <button onclick="sendCommand({ 'RunStorageAiModule': './diagnostics' }, this)">💾 Run Storage AI Analyzer</button>
        <button onclick="sendCommand({ 'RunThermalModule': './diagnostics' }, this)">🌡️ Scan Core Thermals</button>
        <button onclick="sendCommand({ 'RunNetworkModule': './diagnostics' }, this)">🌐 Scan Network Interfaces</button>
        <button onclick="sendCommand({ 'RunFanModule': './diagnostics' }, this)">💨 Profile Fan Control</button>
        <button onclick="sendCommand({ 'RunAudioModule': './diagnostics' }, this)">🎧 Profile Audio Sinks</button>
        <button onclick="sendCommand({ 'RunBiosModule': './diagnostics' }, this)">📟 Check BIOS Layers</button>
        <button onclick="sendCommand({ 'RunDisksModule': './diagnostics' }, this)">🎚️ Analyze Disks Architecture</button>
    </div>

    <h3>📟 LIVE SYSTEM FEED</h3>
    <ul>{{SYSTEM_LOGS}}</ul>
</body>
</html>
